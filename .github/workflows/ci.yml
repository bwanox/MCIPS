name: MCIPS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/evaluate_models.py
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o mcips-agent .
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: agent

  docker:
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend, agent]
    env:
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin@mcips.local
      ADMIN_TENANT_ID: tenant-ci
      ADMIN_PASSWORD_HASH: $2a$10$7EqJtq98hPqEX7fNZaFWoOHiYc7C7ckL5l1xT3W0fvkYlCYwH14iK
      AI_SERVICE_TOKEN: ci-ai-service-token-with-at-least-32-chars
      AGENT_API_TOKEN: ci-agent-api-token-with-at-least-32-chars
      COLLECTOR_KEY_PEPPER: ci-collector-pepper-with-at-least-32-chars
      BOOTSTRAP_COLLECTOR_KEY: ci-bootstrap-collector-key-with-at-least-32-chars
      BOOTSTRAP_COLLECTOR_TENANT_ID: tenant-ci
      BOOTSTRAP_COLLECTOR_ADAPTER: go-agent
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
